services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # 入口口令：强烈建议设置，把访问范围固定在朋友圈
      DG_PASSCODE: ${DG_PASSCODE:-}
      DG_PORT: "8787"
      # 对局回放目录（容器内路径；配合卷持久化）
      DG_REPLAY_DIR: /app/data/replays
    volumes:
      - app-data:/app/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # .env 设 CADDY_MODE=tls 时使用 deploy/Caddyfile.tls（先把其中域名改成你的）
      - ./deploy/Caddyfile.${CADDY_MODE:-http}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
